<!doctype html>
<html lang="en">
  <head>
    <meta name="robots" content="noindex, nofollow" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline Mode | Gstarcademy</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&display=swap" />
    </noscript>
    <link rel="stylesheet" href="./styles.min.css" />
    <style>
      body.offline-body {
        background: #0b0f19;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
        box-sizing: border-box;
        font-family: 'Inter', sans-serif;
        color: #f8fafc;
      }
      .offline-card {
        background: rgba(15, 23, 42, 0.65);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 24px;
        padding: 40px clamp(20px, 5vw, 50px);
        max-width: 600px;
        width: 100%;
        text-align: center;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      }
      .offline-icon {
        font-size: 4rem;
        margin-bottom: 24px;
        animation: offline-glow 2s ease-in-out infinite alternate;
      }
      @keyframes offline-glow {
        from { filter: drop-shadow(0 0 5px rgba(239, 68, 68, 0.4)); }
        to { filter: drop-shadow(0 0 20px rgba(239, 68, 68, 0.8)); }
      }
      .offline-title {
        font-size: 2rem;
        font-weight: 800;
        margin: 0 0 12px;
        color: #f1f5f9;
        letter-spacing: -0.03em;
      }
      .offline-desc {
        color: #94a3b8;
        font-size: 15px;
        line-height: 1.6;
        margin: 0 0 32px;
      }
      .offline-search-title {
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        color: #6366f1;
        letter-spacing: 0.05em;
        margin-bottom: 12px;
        display: block;
      }
      .offline-search-shell {
        position: relative;
        max-width: 480px;
        margin: 0 auto;
      }
      .offline-search-shell input {
        width: 100%;
        padding: 14px 20px;
        background: rgba(255, 255, 255, 0.05) !important;
        border: 1px solid rgba(255, 255, 255, 0.12) !important;
        border-radius: 12px !important;
        color: #f8fafc !important;
        font-size: 14px;
        outline: none;
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
        transition: all 0.25s ease;
      }
      .offline-search-shell input:focus {
        border-color: #6366f1 !important;
        background: rgba(255, 255, 255, 0.08) !important;
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25), inset 0 2px 4px rgba(0, 0, 0, 0.2) !important;
      }
      .offline-search-shell input::placeholder {
        color: #64748b !important;
      }
      .offline-footer {
        margin-top: 36px;
        display: flex;
        gap: 16px;
        justify-content: center;
      }
      .btn-offline-reload {
        background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
        border: none;
        color: white;
        padding: 10px 24px;
        border-radius: 10px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
        box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
      }
      .btn-offline-reload:hover {
        transform: translateY(-1.5px);
        box-shadow: 0 6px 18px rgba(99, 102, 241, 0.4);
      }
      .btn-offline-reload:active {
        transform: translateY(0);
      }
      .btn-offline-back {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: #e2e8f0;
        padding: 10px 24px;
        border-radius: 10px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        text-decoration: none;
        transition: background 0.2s ease;
      }
      .btn-offline-back:hover {
        background: rgba(255, 255, 255, 0.05);
      }
    </style>
  </head>
  <body class="offline-body">
    <div class="offline-card">
      <div class="offline-icon" aria-hidden="true">📡</div>
      <h1 class="offline-title">You are currently offline</h1>
      <p class="offline-desc">
        It seems you have lost your internet connection. However, thanks to the PWA framework, 
        you can still search and read previously cached CAD concepts!
      </p>

      <span class="offline-search-title">Offline Concept Search</span>
      <div class="offline-search-shell">
        <input
          type="text"
          placeholder="Search 700+ cached CAD terms..."
          aria-label="Search CAD concepts offline"
        />
      </div>

      <div class="offline-footer">
        <button type="button" class="btn-offline-reload" onclick="window.location.reload();">Retry Connection</button>
        <a href="./" class="btn-offline-back">Go to Homepage</a>
      </div>
    </div>

    <!-- PWA core elements and search engine -->
    <script src="./app.min.js?v=20260827" defer></script>
    <script src="./search.min.js?v=20260827" defer></script>
  </body>
</html>
