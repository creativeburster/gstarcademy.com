<!DOCTYPE html>

<head>
    <!-- Google tag (gtag.js) - Performance Optimized Loading -->
    <link rel="preconnect" href="https://www.googletagmanager.com" />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      window.gtag = gtag;
      window.addEventListener('load', function() {
        const initGtag = () => {
          const script = document.createElement('script');
          script.src = 'https://www.googletagmanager.com/gtag/js?id=G-ZV3YR72933';
          script.async = true;
          document.head.appendChild(script);
          gtag('js', new Date());
          gtag('config', 'G-ZV3YR72933');
        };
        if ('requestIdleCallback' in window) {
          requestIdleCallback(initGtag);
        } else {
          setTimeout(initGtag, 1);
        }
      });
    </script>
    <meta charset="utf-8">
    <title>Redirecting...</title>

        window.location.href = "./dwg-mode-inventor.html";
    </script>
</head>
